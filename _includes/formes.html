{%- comment -%}
  Formes libres de la charte. Une seule couleur à la fois (currentColor) :
  blanc sur bleu foncé, blanc sur bleu clair. Jamais de texte par-dessus :
  elles occupent leur propre espace dans la mise en page.
{%- endcomment -%}
{%- assign id = include.id | default: "f" -%}
<svg class="formes {{ include.classe }}" viewBox="0 0 520 440" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="trame-{{ id }}" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3.2" height="11" fill="currentColor"/>
    </pattern>
  </defs>
  <g fill="currentColor">
    <rect style="--i:0" x="300" y="30" width="34" height="34" rx="3"/>
    <path style="--i:1" d="M150 40 a92 92 0 0 1 92 92" fill="none" stroke="currentColor" stroke-width="34"/>
    <rect style="--i:2" x="330" y="120" width="170" height="38" rx="3" transform="rotate(-36 415 139)"/>
    <rect style="--i:3" x="40" y="170" width="150" height="74" fill="url(#trame-{{ id }})"/>
    <rect style="--i:4" x="258" y="222" width="24" height="24" rx="2"/>
    <rect style="--i:5" x="150" y="320" width="190" height="36" rx="3" transform="rotate(26 245 338)"/>
    <rect style="--i:6" x="450" y="250" width="36" height="150" rx="3"/>
    <path style="--i:7" d="M40 390 a68 68 0 0 1 68 -68" fill="none" stroke="currentColor" stroke-width="30"/>
    <rect style="--i:8" x="30" y="60" width="20" height="20" rx="2"/>
    <rect style="--i:9" x="340" y="300" width="84" height="50" fill="url(#trame-{{ id }})"/>
    <rect style="--i:10" x="395" y="410" width="18" height="18" rx="2"/>
  </g>
</svg>
